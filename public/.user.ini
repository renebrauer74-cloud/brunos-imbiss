; PHP-Limits für Foto-Uploads (passend zu UPLOAD_MAX_KILOBYTES in der .env, Standard 20 MB)
; Greift bei PHP-FPM/CGI (z. B. IONOS); Änderungen werden nach user_ini.cache_ttl (Standard 5 Min.) wirksam.
upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 30
max_input_time = 300
max_execution_time = 300
memory_limit = 512M
